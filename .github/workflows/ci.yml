name: ci
on:
  push:
    branches: [main, develop, "release/**"]
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1" # weekly full run: cargo audit picks up new advisories
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    uses: discordy-voics/.github/.github/workflows/gitflow-guard.yml@main

  rust:
    permissions:
      contents: read
      actions: read   # shared workflow: tag builds look up the main run of this commit
    uses: discordy-voics/.github/.github/workflows/rust.yml@main
    with:
      working-directory: bff
      # RUSTSEC-2023-0071 (rsa Marvin attack) has no fixed release; rsa is a dev-dependency
      # (test fixtures) only and is never part of the shipped admin BFF binary.
      # RUSTSEC-2026-0459 (libsqlite3-sys bundled SQLite CVE) is only in bff/Cargo.lock as sqlx's optional sqlite backend:
      # the feature is off, so it is never compiled (`cargo tree -i libsqlite3-sys` is empty). sqlx 0.8 pins 0.30; drop this
      # when sqlx is upgraded.
      audit-args: --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0459
  web:
    permissions:
      contents: read
      actions: read   # shared workflow: tag builds look up the main run of this commit
      packages: read  # private npm packages (GitHub Packages)
    uses: discordy-voics/.github/.github/workflows/node.yml@main
    with:
      working-directory: web
  docker:
    needs: [rust, web]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: discordy-voics/.github/.github/workflows/docker.yml@main
    with:
      image-name: admin
      description: Voics admin portal (Rust BFF with embedded React SPA)
